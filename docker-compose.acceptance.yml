name: libswiftride-acceptance
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: libswiftride_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: acceptance-only-local
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d libswiftride_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    # No existing application volume is mounted. Image-created anonymous volumes
    # contain fictional test fixtures only; remove them explicitly with down -v.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
