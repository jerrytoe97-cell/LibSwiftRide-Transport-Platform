name: CI
on:
  pull_request:
  push:
    branches: [main, development, phase-2-development]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: libswiftride_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/libswiftride_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-at-least-32-characters
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-at-least-16
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Exercise isolated backup and restore validation
        env:
          PGPASSWORD: test
          RECOVERY_DATABASE_URL: postgresql://test:test@localhost:5432/libswiftride_recovery
        run: |
          pg_dump "$DATABASE_URL" --format=custom --file=/tmp/libswiftride-test.dump
          psql postgresql://test:test@localhost:5432/postgres --set=ON_ERROR_STOP=1 --command='CREATE DATABASE libswiftride_recovery'
          pg_restore --dbname="$RECOVERY_DATABASE_URL" --exit-on-error /tmp/libswiftride-test.dump
          DATABASE_URL="$RECOVERY_DATABASE_URL" pnpm recovery:validate
          rm -f /tmp/libswiftride-test.dump
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: libswiftride/api:${{ github.sha }}
