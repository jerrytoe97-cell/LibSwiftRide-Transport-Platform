name: Staging browser smoke

on:
  workflow_dispatch:
  push:
    branches: [phase-2-development]

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      STAGING_WEB_URL: https://libswiftride-web.onrender.com
      STAGING_PASSENGER_URL: https://libswiftride-passenger.onrender.com
      STAGING_DRIVER_URL: https://libswiftride-driver.onrender.com
      STAGING_FLEET_URL: https://libswiftride-fleet.onrender.com
      STAGING_ADMIN_URL: https://libswiftride-admin.onrender.com
      STAGING_DISPATCHER_URL: https://libswiftride-dispatcher.onrender.com
      STAGING_BUSINESS_URL: https://libswiftride-business.onrender.com
      STAGING_API_URL: https://libswiftride-transport-platform.onrender.com
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for matching CI validation
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            result="$(gh run list --workflow CI --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | [.status, (.conclusion // "")] | @tsv')"
            status="${result%%$'\t'*}"
            conclusion="${result#*$'\t'}"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] && exit 0
              echo "Matching CI completed with: $conclusion"
              exit 1
            fi
            echo "Waiting for matching CI (attempt $attempt/60; status: ${status:-not-found})"
            sleep 20
          done
          echo "Matching CI did not complete within 20 minutes"
          exit 1

      - name: Allow checks-gated staging rollout to settle
        if: github.event_name == 'push'
        run: sleep 120

      - name: Run staging browser smoke suite
        run: pnpm test:browser:staging

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
