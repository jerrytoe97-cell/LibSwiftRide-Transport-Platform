openapi: 3.1.0
info:
  title: LibSwiftRide API
  version: 0.5.0
  description: Versioned API for LibSwiftRide passengers, drivers, fleets and operations.
servers:
  - url: https://api.example.com/api/v1
  - url: http://localhost:4000/api/v1
components:
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    AccountingKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Location:
      type: object
      required: [address, latitude, longitude]
      properties:
        address: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
paths:
  /admin/drivers/{id}/vehicle:
    post:
      security: [{ bearerAuth: [] }]
      summary: Active administrator attests vehicle compliance and assigns an approved driver
      description: Requires all five clean reviewed KYC documents and future expiry dates. Records an audit and leaves the driver offline for a fresh eligibility check.
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [make, model, year, color, plateNumber, insuranceExpiresAt, inspectionExpiresAt, registrationExpiresAt, evidenceReference]
              properties:
                vehicleId: { type: string, format: uuid }
                fleetId: { type: [string, 'null'], format: uuid }
                make: { type: string, minLength: 1, maxLength: 80 }
                model: { type: string, minLength: 1, maxLength: 80 }
                year: { type: integer, minimum: 1990 }
                color: { type: string, minLength: 1, maxLength: 40 }
                plateNumber: { type: string, minLength: 3, maxLength: 30 }
                insuranceExpiresAt: { type: string, format: date-time }
                inspectionExpiresAt: { type: string, format: date-time }
                registrationExpiresAt: { type: string, format: date-time }
                evidenceReference: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200': { description: Vehicle provisioned and audited }
        '403': { description: Active administrator required }
        '409': { description: Driver, vehicle or compliance changed }
        '422': { description: Required documents or valid inputs missing }
  /admin/drivers/{id}/cash-collections:
    post:
      security: [{ bearerAuth: [] }]
      summary: Administrator records an evidenced physical cash commission handover
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/AccountingKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, evidence]
              properties:
                amountMinor: { type: integer, minimum: 1, maximum: 2147483647 }
                evidence: { type: string, minLength: 8, maxLength: 500 }
      responses:
        '200': { description: Balanced journal recorded or replayed }
        '403': { description: Active administrator required }
        '409': { description: Reconciliation or idempotency conflict }
        '422': { description: Collection exceeds receivable or invalid input }
  /admin/payouts/{id}/cash-resolution:
    post:
      security: [{ bearerAuth: [] }]
      summary: Administrator records a physical cash payout or cancels its reservation
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/AccountingKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, evidence]
              properties:
                outcome: { type: string, enum: [PAID, CANCELLED] }
                evidence: { type: string, minLength: 8, maxLength: 500 }
      responses:
        '200': { description: Balanced payout or reservation reversal journal }
        '403': { description: Active administrator required }
        '409': { description: Final payout or reconciliation conflict }
        '422': { description: Insufficient recorded company cash or invalid input }
  /admin/refunds/{id}/cash-completion:
    post:
      security: [{ bearerAuth: [] }]
      summary: Administrator records approved cash returned by the driver to the passenger
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/AccountingKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence: { type: string, minLength: 8, maxLength: 500 }
      responses:
        '200': { description: Refund and proportional commission reversal recorded }
        '403': { description: Active administrator required }
        '409': { description: Refund not approved, cash settlement missing, or replay conflict }
        '422': { description: Refund exceeds captured amount or invalid evidence }
  /admin/drivers/{id}/adjustments:
    post:
      security: [{ bearerAuth: [] }]
      summary: Administrator applies an evidenced payable adjustment against a reviewed balance
      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/AccountingKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deltaMinor, expectedBalanceMinor, evidence]
              properties:
                deltaMinor: { type: integer, minimum: -2147483647, maximum: 2147483647, not: { const: 0 } }
                expectedBalanceMinor: { type: integer }
                evidence: { type: string, minLength: 8, maxLength: 500 }
      responses:
        '200': { description: Balanced adjustment journal }
        '403': { description: Active administrator required }
        '409': { description: Balance changed or reconciliation required }
        '422': { description: Insufficient available funds or invalid input }
  /admin/adjustments/{id}/reversal:
    post:
      security: [{ bearerAuth: [] }]
      summary: Administrator reverses a manual adjustment once without changing its original journal
      description: The original journal identifier is the unique reversal key.
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence: { type: string, minLength: 8, maxLength: 500 }
      responses:
        '200': { description: Balanced reversal journal }
        '403': { description: Active administrator required }
        '409': { description: Funds unavailable, currency mismatch, or replay conflict }
        '422': { description: Unsupported original journal or invalid evidence }
  /admin/drivers/{id}/reconciliation:
    post:
      security: [{ bearerAuth: [] }]
      summary: Administrator records a wallet reconciliation snapshot without changing balances
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Audit snapshot with discrepancies and missing settlements }
        '403': { description: Active administrator required }
        '409': { description: Audit key belongs to another request }
  /users/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the authenticated user's profile, role and verification state
      responses: { "200": { description: Current profile } }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update the authenticated user's name, email or locale
      responses:
        "200": { description: Updated profile }
        "422": { description: Invalid profile input }
  /auth/sessions:
    get:
      security: [{ bearerAuth: [] }]
      summary: List active refresh-token sessions for the current account
      responses: { "200": { description: Active sessions } }
  /auth/sessions/{id}:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Revoke one session owned by the current account
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Session revoked }
        "404": { description: Session not found or not owned by the account }
  /drivers/me/onboarding:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the current driver's onboarding, verification and vehicle status
      responses: { "200": { description: Driver onboarding state, or null before onboarding } }
  /corporate/account:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the authorized business account, employees and monthly budget usage
      responses: { "200": { description: Corporate account overview } }
  /corporate/employees:
    post:
      security: [{ bearerAuth: [] }]
      summary: Add an employee with a bounded monthly ride allowance
      responses: { "201": { description: Employee added } }
  /deliveries:
    get:
      security: [{ bearerAuth: [] }]
      summary: List role-scoped delivery requests
      responses: { "200": { description: Deliveries } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create an idempotent server-priced delivery request
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses: { "201": { description: Delivery requested } }
  /ride-passes/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: List the passenger's monthly passes and remaining credits
      responses: { "200": { description: Ride passes } }
  /payments/{id}/confirm-mobile-money:
    post:
      security: [{ bearerAuth: [] }]
      summary: Manually confirm a pending Mobile Money payment with audited evidence
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8 }
      responses:
        "200": { description: Payment confirmed or idempotently replayed }
        "409": { description: Payment is not confirmable or key was reused }
  /reports/advanced:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read corporate, delivery, incentive, campaign and fraud analytics
      responses: { "200": { description: Advanced analytics } }
  /admin/audit-logs:
    get:
      security: [{ bearerAuth: [] }]
      summary: Query cursor-paginated privileged audit events
      responses: { "200": { description: Audit events } }
  /auth/register:
    post:
      summary: Register a passenger or driver account
      responses:
        "201": { description: Account created }
        "422": { description: Validation error }
  /auth/login:
    post:
      summary: Sign in and issue access and refresh tokens
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
  /auth/refresh:
    post:
      summary: Rotate a refresh token
      responses:
        "200": { description: Tokens rotated }
        "401": { description: Invalid refresh token }
  /locations/search:
    post:
      security: [{ bearerAuth: [] }]
      summary: Search Liberia addresses (Passenger only; provider credentials remain server-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 3, maxLength: 150 }
      responses:
        "200": { description: "data array of id, address, latitude, longitude; private/no-store" }
        "401": { description: Authentication required }
        "403": { description: Passenger role required }
        "422": { description: Invalid search input }
        "429": { description: Address lookup rate limit reached }
        "503": { description: Geocoding disabled or unavailable }
  /locations/reverse:
    post:
      security: [{ bearerAuth: [] }]
      summary: Resolve GPS coordinates to an address (Passenger only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200": { description: "data object with id, address, latitude, longitude, or null; private/no-store" }
        "401": { description: Authentication required }
        "403": { description: Passenger role required }
        "422": { description: Invalid coordinates }
        "429": { description: Address lookup rate limit reached }
        "503": { description: Geocoding disabled or unavailable }
  /rides/quote:
    post:
      security: [{ bearerAuth: [] }]
      summary: Calculate a routed, server-authoritative fare estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, destination]
              properties:
                pickup: { $ref: "#/components/schemas/Location" }
                destination: { $ref: "#/components/schemas/Location" }
                rideType: { type: string, enum: [ECONOMY], default: ECONOMY }
                promoCode: { type: string }
      responses:
        "200": { description: Fare, distance, duration, ride type, and GeoJSON-order route coordinates }
        "422": { description: Invalid locations or no driving route is available }
        "503": { description: Routing provider network failure }
  /rides:
    get:
      security: [{ bearerAuth: [] }]
      summary: List role-scoped ride history
      responses: { "200": { description: Ride history } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Book a ride
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "201": { description: Ride requested }
  /rides/{id}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read a participant-authorized ride
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Ride }
        "403": { description: Access denied }
  /rides/{id}/transitions:
    post:
      security: [{ bearerAuth: [] }]
      summary: Advance a ride through an authorized lifecycle transition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Updated ride }
  /rides/{id}/payments:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a cash, mobile-money or Stripe payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Payment created }
  /promos/validate:
    post:
      security: [{ bearerAuth: [] }]
      summary: Validate passenger promotion eligibility
      responses:
        "200": { description: Eligible promotion and bounded discount }
        "404": { description: Promotion unavailable }
  /notifications:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read notifications and unread count
      responses: { "200": { description: Notification inbox } }
  /payments/mobile-money/{method}/display:
    get:
      security: [{ bearerAuth: [] }]
      summary: Display the selected Mobile Money recipient to an authenticated passenger
      parameters:
        - in: path
          name: method
          required: true
          schema: { type: string, enum: [ORANGE_MONEY, MTN_MOMO] }
      responses:
        "200": { description: Selected Mobile Money display configuration }
        "503": { description: Selected destination is not configured }
  /wallet:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the authenticated user's wallet and ledger
      responses: { "200": { description: Wallet } }
  /fleet/overview:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read manager-authorized fleet data
      responses: { "200": { description: Fleet overview } }
  /admin/overview:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read operational analytics
      responses: { "200": { description: Analytics overview } }
  /admin/promos:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read promotion utilization
      responses: { "200": { description: Promotion list } }
  /admin/settings/payments:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read payment configuration status without account-number values
      responses: { "200": { description: Payment configuration status } }
  /drivers/me/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read consolidated driver operations dashboard
      responses: { "200": { description: Driver dashboard } }
  /dispatch/drivers:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read verified available drivers for dispatch
      responses: { "200": { description: Eligible driver list } }
