openapi: 3.1.0
info:
  title: LibSwiftRide API
  version: 0.5.0
  description: Versioned API for LibSwiftRide passengers, drivers, fleets and operations.
servers:
  - url: https://api.example.com/api/v1
  - url: http://localhost:4000/api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Location:
      type: object
      required: [address, latitude, longitude]
      properties:
        address: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
paths:
  /corporate/account:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the authorized business account, employees and monthly budget usage
      responses: { "200": { description: Corporate account overview } }
  /corporate/employees:
    post:
      security: [{ bearerAuth: [] }]
      summary: Add an employee with a bounded monthly ride allowance
      responses: { "201": { description: Employee added } }
  /deliveries:
    get:
      security: [{ bearerAuth: [] }]
      summary: List role-scoped delivery requests
      responses: { "200": { description: Deliveries } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create an idempotent server-priced delivery request
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses: { "201": { description: Delivery requested } }
  /ride-passes/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: List the passenger's monthly passes and remaining credits
      responses: { "200": { description: Ride passes } }
  /payments/{id}/confirm-mobile-money:
    post:
      security: [{ bearerAuth: [] }]
      summary: Manually confirm a pending Mobile Money payment with audited evidence
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8 }
      responses:
        "200": { description: Payment confirmed or idempotently replayed }
        "409": { description: Payment is not confirmable or key was reused }
  /reports/advanced:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read corporate, delivery, incentive, campaign and fraud analytics
      responses: { "200": { description: Advanced analytics } }
  /admin/audit-logs:
    get:
      security: [{ bearerAuth: [] }]
      summary: Query cursor-paginated privileged audit events
      responses: { "200": { description: Audit events } }
  /auth/register:
    post:
      summary: Register a passenger or driver account
      responses:
        "201": { description: Account created }
        "422": { description: Validation error }
  /auth/login:
    post:
      summary: Sign in and issue access and refresh tokens
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
  /auth/refresh:
    post:
      summary: Rotate a refresh token
      responses:
        "200": { description: Tokens rotated }
        "401": { description: Invalid refresh token }
  /rides/quote:
    post:
      security: [{ bearerAuth: [] }]
      summary: Calculate a server-authoritative fare estimate
      responses:
        "200": { description: Fare quote }
  /rides:
    get:
      security: [{ bearerAuth: [] }]
      summary: List role-scoped ride history
      responses: { "200": { description: Ride history } }
    post:
      security: [{ bearerAuth: [] }]
      summary: Book a ride
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        "201": { description: Ride requested }
  /rides/{id}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read a participant-authorized ride
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Ride }
        "403": { description: Access denied }
  /rides/{id}/transitions:
    post:
      security: [{ bearerAuth: [] }]
      summary: Advance a ride through an authorized lifecycle transition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Updated ride }
  /rides/{id}/payments:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a cash, mobile-money or Stripe payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Payment created }
  /promos/validate:
    post:
      security: [{ bearerAuth: [] }]
      summary: Validate passenger promotion eligibility
      responses:
        "200": { description: Eligible promotion and bounded discount }
        "404": { description: Promotion unavailable }
  /notifications:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read notifications and unread count
      responses: { "200": { description: Notification inbox } }
  /payments/mobile-money/{method}/display:
    get:
      security: [{ bearerAuth: [] }]
      summary: Display the selected Mobile Money recipient to an authenticated passenger
      parameters:
        - in: path
          name: method
          required: true
          schema: { type: string, enum: [ORANGE_MONEY, MTN_MOMO] }
      responses:
        "200": { description: Selected Mobile Money display configuration }
        "503": { description: Selected destination is not configured }
  /wallet:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the authenticated user's wallet and ledger
      responses: { "200": { description: Wallet } }
  /fleet/overview:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read manager-authorized fleet data
      responses: { "200": { description: Fleet overview } }
  /admin/overview:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read operational analytics
      responses: { "200": { description: Analytics overview } }
  /admin/promos:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read promotion utilization
      responses: { "200": { description: Promotion list } }
  /admin/settings/payments:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read payment configuration status without account-number values
      responses: { "200": { description: Payment configuration status } }
  /drivers/me/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read consolidated driver operations dashboard
      responses: { "200": { description: Driver dashboard } }
  /dispatch/drivers:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read verified available drivers for dispatch
      responses: { "200": { description: Eligible driver list } }
